name: Tap checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate sync script
        run: bash -n scripts/sync-cask.sh scripts/audit-cask.sh

      - name: Audit the cask when a verified stable release exists
        run: scripts/audit-cask.sh
