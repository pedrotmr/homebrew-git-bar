name: Sync Homebrew cask

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-homebrew-cask
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the latest stable release and update the cask
        run: scripts/sync-cask.sh

      - name: Audit the cask
        run: scripts/audit-cask.sh

      - name: Commit the verified cask update
        shell: bash
        run: |
          set -euo pipefail
          cask="Casks/pedrotmr-git-bar.rb"
          if [[ ! -f "$cask" ]]; then
            echo "No installable cask exists until a signed and notarized Sparkle release is available."
            exit 0
          fi
          git add "$cask"
          if git diff --cached --quiet -- "$cask"; then
            echo "The cask is already current or the latest release is not installable yet."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$cask")
          git commit -m "chore: update GitBar cask to v$version"
          git push origin HEAD:main
